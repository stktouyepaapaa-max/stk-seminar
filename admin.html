<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Dashboard Admin - STK Touye Paapaa
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f4f7fb;

      color: #172033;

    }


    .container {

      width: 94%;

      max-width: 1200px;

      margin: 0 auto;

    }


    header {

      text-align: center;

      padding:
        35px 20px 25px;

    }


    header h1 {

      margin: 0;

      color: #1260d9;

      font-size: 32px;

    }


    header p {

      margin:
        8px 0 0;

      color: #555;

      font-size: 17px;

    }


    .top-bar {

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 15px;

      margin-bottom: 20px;

      flex-wrap: wrap;

    }


    .title-admin {

      font-size: 24px;

      font-weight: bold;

      color: #1260d9;

    }


    button {

      border: none;

      border-radius: 10px;

      padding:
        13px 20px;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;

    }


    .btn-refresh {

      background: #1260d9;

      color: white;

    }


    .btn-home {

      background: #777;

      color: white;

    }


    .stats {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 18px;

      margin-bottom: 25px;

    }


    .stat-card {

      background: white;

      border-radius: 15px;

      padding: 25px;

      box-shadow:
        0 5px 20px
        rgba(0,0,0,.08);

      text-align: center;

    }


    .stat-icon {

      font-size: 32px;

      margin-bottom: 8px;

    }


    .stat-number {

      font-size: 38px;

      font-weight: bold;

      color: #1260d9;

    }


    .stat-label {

      margin-top: 5px;

      color: #555;

      font-size: 16px;

    }


    .card {

      background: white;

      border-radius: 15px;

      padding: 25px;

      box-shadow:
        0 5px 20px
        rgba(0,0,0,.08);

      margin-bottom: 25px;

    }


    .card h2 {

      margin-top: 0;

      color: #1260d9;

    }


    .status-message {

      padding: 15px;

      border-radius: 10px;

      background: #eef5ff;

      margin-bottom: 20px;

      display: none;

    }


    .table-wrapper {

      overflow-x: auto;

    }


    table {

      width: 100%;

      border-collapse:
        collapse;

      min-width: 750px;

    }


    th {

      background: #1260d9;

      color: white;

      padding: 13px;

      text-align: left;

    }


    td {

      padding: 13px;

      border-bottom:
        1px solid #e5e5e5;

    }


    tr:hover td {

      background: #f7faff;

    }


    .badge {

      display: inline-block;

      padding:
        6px 10px;

      border-radius: 20px;

      font-size: 13px;

      font-weight: bold;

    }


    .hadir {

      background: #dff7e7;

      color: #16803c;

    }


    .belum {

      background: #fff0d6;

      color: #a65b00;

    }


    .loading {

      text-align: center;

      padding: 30px;

      color: #666;

    }


    .error {

      background: #ffe5e5;

      color: #b00020;

      padding: 15px;

      border-radius: 10px;

      margin-bottom: 20px;

      display: none;

    }


    footer {

      text-align: center;

      padding:
        20px;

      color: #777;

      font-size: 14px;

    }


    @media
    (max-width: 700px) {

      header h1 {

        font-size: 25px;

      }


      .stats {

        grid-template-columns:
          1fr;

      }


      .top-bar {

        align-items:
          stretch;

      }


      .top-bar button {

        width: 100%;

      }


      .title-admin {

        text-align: center;

        width: 100%;

      }

    }

  </style>

</head>


<body>


  <header>

    <h1>
      STK TOUYE PAPAA
    </h1>

    <p>
      Dashboard Admin Seminar
    </p>

  </header>


  <main class="container">


    <div class="top-bar">

      <div class="title-admin">
        Dashboard Seminar
      </div>


      <div>

        <button
          class="btn-refresh"
          onclick="loadDashboard()"
        >
          🔄 REFRESH DATA
        </button>


        <button
          class="btn-home"
          onclick="goHome()"
        >
          ← BERANDA
        </button>

      </div>

    </div>


    <div
      id="errorBox"
      class="error"
    ></div>


    <div
      id="statusMessage"
      class="status-message"
    >
      Memuat data dashboard...
    </div>


    <!-- ==========================
         STATISTIK
    =========================== -->

    <section class="stats">


      <div class="stat-card">

        <div class="stat-icon">
          👥
        </div>

        <div
          id="totalPeserta"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          Total Peserta
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-icon">
          ✅
        </div>

        <div
          id="totalHadir"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          Sudah Hadir
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-icon">
          ⏳
        </div>

        <div
          id="totalBelumHadir"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          Belum Hadir
        </div>

      </div>


    </section>


    <!-- ==========================
         DAFTAR PESERTA
    =========================== -->

    <section class="card">

      <h2>
        Daftar Peserta
      </h2>


      <div
        id="loading"
        class="loading"
      >
        Memuat data peserta...
      </div>


      <div class="table-wrapper">

        <table>

          <thead>

            <tr>

              <th>
                No. Peserta
              </th>

              <th>
                Nama
              </th>

              <th>
                Instansi
              </th>

              <th>
                Jabatan
              </th>

              <th>
                Presensi
              </th>

              <th>
                Tanggal
              </th>

              <th>
                Jam
              </th>

            </tr>

          </thead>


          <tbody
            id="pesertaTable"
          >

          </tbody>

        </table>

      </div>

    </section>


  </main>


  <footer>

    © 2026 STK Touye Paapaa Deiyai

  </footer>


  <script>

    // =====================================================
    // URL API GOOGLE APPS SCRIPT
    // =====================================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbx2bss58f7H5H-unGRwd5Sfnl7KeBF8zcpeUqh1NKxGqThABj4322DZKxpZ3OXxa44U/exec";


    // =====================================================
    // LOAD DASHBOARD
    // =====================================================

    async function loadDashboard() {

      const loading =
        document.getElementById(
          "loading"
        );

      const statusMessage =
        document.getElementById(
          "statusMessage"
        );

      const errorBox =
        document.getElementById(
          "errorBox"
        );


      loading.style.display =
        "block";

      statusMessage.style.display =
        "block";

      errorBox.style.display =
        "none";


      try {


        const response =
          await fetch(
            API_URL,
            {

              method:
                "POST",

              headers: {

                "Content-Type":
                  "text/plain;charset=utf-8"

              },

              body:
                JSON.stringify({

                  action:
                    "admin_dashboard"

                })

            }
          );


        const result =
          await response.json();


        console.log(
          "Dashboard:",
          result
        );


        if (
          !result.success
        ) {

          throw new Error(
            result.message ||
            "Gagal mengambil data dashboard."
          );

        }


        // =================================================
        // STATISTIK
        // =================================================

        document.getElementById(
          "totalPeserta"
        ).textContent =
          result.rekap.total_peserta;


        document.getElementById(
          "totalHadir"
        ).textContent =
          result.rekap.total_hadir;


        document.getElementById(
          "totalBelumHadir"
        ).textContent =
          result.rekap.total_belum_hadir;


        // =================================================
        // TABEL PESERTA
        // =================================================

        const table =
          document.getElementById(
            "pesertaTable"
          );


        table.innerHTML =
          "";


        if (
          !result.peserta ||
          result.peserta.length === 0
        ) {

          table.innerHTML = `

            <tr>

              <td
                colspan="7"
                style="text-align:center"
              >
                Belum ada peserta.
              </td>

            </tr>

          `;

        }

        else {

          result.peserta.forEach(
            function(p) {


              const statusClass =
                p.status_presensi ===
                "HADIR"

                  ? "hadir"

                  : "belum";


              const row =
                document.createElement(
                  "tr"
                );


              row.innerHTML = `

                <td>
                  ${escapeHTML(
                    p.no_peserta
                  )}
                </td>

                <td>
                  ${escapeHTML(
                    p.nama
                  )}
                </td>

                <td>
                  ${escapeHTML(
                    p.instansi
                  )}
                </td>

                <td>
                  ${escapeHTML(
                    p.jabatan
                  )}
                </td>

                <td>

                  <span
                    class="badge ${statusClass}"
                  >

                    ${escapeHTML(
                      p.status_presensi
                    )}

                  </span>

                </td>

                <td>
                  ${escapeHTML(
                    p.tanggal_presensi ||
                    "-"
                  )}
                </td>

                <td>
                  ${escapeHTML(
                    p.jam_presensi ||
                    "-"
                  )}
                </td>

              `;


              table.appendChild(
                row
              );

            }
          );

        }


        loading.style.display =
          "none";

        statusMessage.style.display =
          "none";


      }

      catch (error) {

        console.error(
          error
        );


        loading.style.display =
          "none";


        statusMessage.style.display =
          "none";


        errorBox.textContent =
          "Gagal mengambil data: " +
          error.message;


        errorBox.style.display =
          "block";

      }

    }


    // =====================================================
    // KEAMANAN TAMPILAN TEKS
    // =====================================================

    function escapeHTML(value) {

      return String(
        value ?? ""
      )

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    // =====================================================
    // KEMBALI KE BERANDA
    // =====================================================

    function goHome() {

      window.location.href =
        "index.html";

    }


    // =====================================================
    // OTOMATIS MEMUAT DATA
    // =====================================================

    loadDashboard();

  </script>


</body>

</html>
